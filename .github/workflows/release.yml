# Plugin release trigger — copy this file unchanged to every plugin repo.
# Push a tag like:  git tag v1.1 && git push origin v1.1
# All release logic lives in the shared reusable workflow at Imperion-Games/.github.

name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+'

jobs:
  release:
    uses: Imperion-Games/.github/.github/workflows/release-plugin.yml@main
    permissions:
      contents: write
    secrets: inherit
