[FilterPlugin]
; Lists additional files that ship with the plugin which fall outside UE's
; default packaging set (Source/, Resources/, Config/, Content/, .uplugin).
; Anything declared here gets included when RunUAT BuildPlugin packages the
; plugin, and satisfies Fab's "FilterPlugin.ini lists every custom file"
; submission requirement.
;
; Paths are relative to the plugin root. Wildcards "...", "*", "?" supported.
;
; WorldSweep intentionally ships nothing outside the standard layout:
; - LICENSE lives at the repo root, served via GitHub. Buyers get licence
;   terms via Fab's marketplace EULA at purchase time, so the file does not
;   need to travel with the plugin.
; - README.md and CHANGELOG.md live at the repo root and are mirrored to each
;   release's GitHub Release notes. Buyers see documentation and version
;   history on the Fab listing itself.
; - .clang-format is internal dev tooling.
;
; Add entries here only when a real custom file or folder needs to ship.
